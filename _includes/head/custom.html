<!-- Dark/light theme: dark by default, the visitor's choice is remembered. -->
<script>
(function () {
  var root = document.documentElement, theme = 'dark';
  try { if (localStorage.getItem('theme') === 'light') theme = 'light'; } catch (e) {}
  root.setAttribute('data-theme', theme);

  function label() {
    var t = root.getAttribute('data-theme') === 'light' ? 'Switch to dark theme' : 'Switch to light theme';
    Array.prototype.forEach.call(document.querySelectorAll('.theme-toggle'), function (b) {
      b.setAttribute('aria-label', t); b.setAttribute('title', t);
    });
  }
  document.addEventListener('DOMContentLoaded', label);
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('.theme-toggle')) return;
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (err) {}
    label();
  });
})();
</script>
<link rel="stylesheet" href="{{ '/assets/css/light-theme.css' | relative_url }}">

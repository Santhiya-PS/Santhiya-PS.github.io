# The categories shown on the Photography page, in this order.
#   key:         the tag used in _data/photos.yml (lowercase, no spaces)
#   title:       heading on the card and the category view
#   description: what visitors can expect. One line is fine; for more, use a block and separate
#                paragraphs with a blank line (Markdown works):
#                  description: |
#                    First paragraph.
#
#                    Second paragraph.
#   cover:       the `file` of the photo shown on the card (must be in photos.yml)
- key: birds
  title: "Birds"
  description: "Birds I come across, perched or in flight."
  cover: wings-open
- key: astro
  title: "Astro"
  description: "The night sky: the Milky Way, the Moon and more."
  cover: milky-way-core
- key: landscape
  title: "Landscape"
  description: "Open fields, coasts and wide skies."
  cover: palms-in-the-paddy-fields
- key: nature
  title: "Nature"
  description: "Lightning, flowers, butterflies and other small wonders of nature."
  cover: sunflower
- key: city
  title: "City"
  description: "Skylines and tall buildings, in daylight and after dark."
  cover: lower-manhattan-at-night
- key: street
  title: "Street & people"
  description: "Finding moments in between the walks."
  cover: mural
